# 自動アップデーター設定: Windows (x64)
# 構造の説明は updater.mac.toml の冒頭を参照

[updater]
platform = "windows-x64"
interval = "10m"

[provider.github]
token = ""     # avatar-uploader は非公開リポジトリのため必須 (repo の読み取り権限)

[source.avatar-uploader]
repo  = "NaeCqde/avatar-uploader"
asset = "avatar-uploader-Windows-x86_64.exe"

# ※ 現行リリースは旧形式(zip, Windows-msvc-x86_64)。下の asset 名は新形式の命名規則
#   (<program>-<OS>-<arch>.exe) からの推定。実際のリリースで確認すること。
[source.open-remote-url-sender]
repo  = "NaeCqde/open-remote-url"
asset = "open-remote-url-sender-Windows-x86_64.exe"

[source.open-remote-url-receiver]
repo  = "NaeCqde/open-remote-url"
asset = "open-remote-url-receiver-Windows-x86_64.exe"

# service.kind = "windows-process"  (open-remote-url の kill_other_daemon_processes / start_daemon と同じ)
#   停止 = taskkill /F /IM <process>.exe
#   起動 = exe を切り離して起動(コンソール窓なし)。args があれば付与
[[target]]
name    = "avatar-uploader"
source  = "avatar-uploader"
copy    = [{ to = 'C:\Users\USER\Documents\Abyss\Avatar-Uploader\avatar-uploader.exe' }]
service = { kind = "windows-process", process = "avatar-uploader.exe", exe = 'C:\Users\USER\Documents\Abyss\Avatar-Uploader\avatar-uploader.exe' }

[[target]]
name    = "open-remote-url-sender"
source  = "open-remote-url-sender"
copy    = [{ to = 'C:\Users\USER\AppData\Local\Programs\open-remote-url\sender\open-remote-url-sender.exe' }]
service = { kind = "windows-process", process = "open-remote-url-sender.exe", exe = 'C:\Users\USER\AppData\Local\Programs\open-remote-url\sender\open-remote-url-sender.exe', args = ["--daemon"] }

[[target]]
name    = "open-remote-url-receiver"
source  = "open-remote-url-receiver"
copy    = [{ to = 'C:\Users\USER\AppData\Local\Programs\open-remote-url\receiver\open-remote-url-receiver.exe' }]
service = { kind = "windows-process", process = "open-remote-url-receiver.exe", exe = 'C:\Users\USER\AppData\Local\Programs\open-remote-url\receiver\open-remote-url-receiver.exe', args = ["--daemon"] }

# --- gh-updater 自身の自己更新 ---------------------------------------------
# 全ての対象の更新が終わった周回の最後に行う (途中の更新を中断しない)。
# 新しい版は --version で動作確認してから置換し、同じ引数で起動し直す。
[source.gh-updater]
repo  = "NaeCqde/gh-updater"
asset = "gh-updater-Windows-x86_64.exe"

[self_update]
source = "gh-updater"
